<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernportal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Lernportal – Heftseite: Karopapier, Füller-Blau, Fächerfarben wie Heftumschläge.
   Layout: Navigationsleiste links (Tablet quer) bzw. unten (Hochformat/Handy), Inhalt als ruhige Kartenspalte. */
:root {
  --bg: #f6f7fb;
  --grid: rgba(40, 70, 160, 0.06);
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --line: #dfe3ee;
  --fg: #1b2135;
  --muted: #5d6680;
  --accent: #2d4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fd;
  --good: #23864a;
  --good-soft: #e1f3e8;
  --warn: #b26a00;
  --warn-soft: #fbefd9;
  --bad: #c43a31;
  --bad-soft: #fbe4e1;
  --shadow: 0 1px 2px rgba(20, 30, 70, 0.06), 0 4px 14px rgba(20, 30, 70, 0.05);
  --radius: 14px;
  --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-head: "Segoe UI Semibold", "Roboto", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11152a; --grid: rgba(140, 165, 255, 0.05); --surface: #1a1f38; --surface-2: #232946; --line: #2f3657;
    --fg: #e8ebf7; --muted: #9aa3c2; --accent: #8ba2ff; --accent-ink: #0d1230; --accent-soft: #252e5c;
    --good: #5fcf8a; --good-soft: #17352a; --warn: #f0b153; --warn-soft: #3a2c14; --bad: #ff8a80; --bad-soft: #3d1d1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11152a; --grid: rgba(140, 165, 255, 0.05); --surface: #1a1f38; --surface-2: #232946; --line: #2f3657;
  --fg: #e8ebf7; --muted: #9aa3c2; --accent: #8ba2ff; --accent-ink: #0d1230; --accent-soft: #252e5c;
  --good: #5fcf8a; --good-soft: #17352a; --warn: #f0b153; --warn-soft: #3a2c14; --bad: #ff8a80; --bad-soft: #3d1d1c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--fg);
  font: 16px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 1.02rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.tabular { font-variant-numeric: tabular-nums; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.grow { flex: 1 1 auto; min-width: 0; }
.right { text-align: right; }
code { font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Icons */
.ico { display: inline-flex; width: 1.25em; height: 1.25em; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.flip-x { transform: scaleX(-1); }
.big-ico { width: 48px; height: 48px; color: var(--accent); margin: 0 auto 8px; }

/* ---------- Shell */
#app { display: flex; min-height: 100vh; }
.nav {
  position: sticky; top: 0; height: 100vh; width: 200px; flex: none;
  display: flex; flex-direction: column; gap: 6px; padding: 18px 12px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-weight: 700; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-head); font-size: 1.1rem; }
.nav-links { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-weight: 600; min-height: 46px;
}
.nav-link .ico { width: 24px; height: 24px; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link.active { background: var(--accent-soft); color: var(--accent); }
.view { flex: 1; min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
body.focus-mode .view { max-width: 900px; }

@media (max-width: 860px) {
  #app { flex-direction: column; }
  .nav {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; width: auto; z-index: 20;
    flex-direction: row; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    border-right: 0; border-top: 1px solid var(--line);
  }
  .brand { display: none; }
  .nav-links { flex-direction: row; gap: 2px; }
  .nav-link { flex: 1; flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 0.72rem; justify-content: center; }
  .parent-link { flex: 0 0 64px; }
  .view { padding-bottom: 110px; }
  body.focus-mode .view { padding-bottom: 32px; }
}

/* ---------- Basics */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.center { align-items: center; text-align: center; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card h2 .dot, .card-head h2 .dot { margin-right: 8px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p.muted { margin-top: 4px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }
h3.sub { margin-top: 6px; font-size: 0.95rem; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 16px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: 600 0.98rem/1.2 var(--font); cursor: pointer; text-decoration: none;
  transition: transform .08s ease, background .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger.ghost { background: transparent; color: var(--bad); border-color: var(--bad-soft); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.88rem; }
.btn.big { min-height: 52px; padding: 12px 22px; font-size: 1.05rem; }
.btn.xl { min-height: 60px; padding: 14px 28px; font-size: 1.15rem; border-radius: 14px; }
.btn.xl .ico { width: 22px; height: 22px; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--bad-soft); color: var(--bad); }
.link { font-weight: 600; text-decoration: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 0.82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip.strong { background: var(--surface); border: 1px solid var(--line); color: var(--fg); padding: 7px 12px; font-size: 0.92rem; }
.chip.strong .ico { color: var(--accent); }
.chip.subj { color: var(--fg); }
.stat-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
.dot.big { width: 14px; height: 14px; vertical-align: -1px; }
.subj .dot { background: var(--c); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill .ico { width: 16px; height: 16px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.muted-pill { background: var(--surface-2); color: var(--muted); }

.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 60px; }
.card > .meter, .reward .meter, .deck-tile .meter, .stat .meter { flex: none; width: 100%; }
.meter-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }

.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); min-width: 0; }
.card > h2 + .list-row, .card-head + .list-row, .card > p + .list-row { border-top: 0; }
.link-row { color: inherit; text-decoration: none; border-radius: 8px; }
.link-row:hover { background: var(--surface-2); }
.link-row > .ico { color: var(--muted); }

.grade { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 8px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--surface-2); }
.grade.g1, .grade.g2 { background: var(--good-soft); color: var(--good); }
.grade.g3 { background: var(--accent-soft); color: var(--accent); }
.grade.g4 { background: var(--warn-soft); color: var(--warn); }
.grade.g5, .grade.g6 { background: var(--bad-soft); color: var(--bad); }
.grade-trail { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; transition: all .25s ease; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: var(--good); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
.offline { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; }
.demo-banner { background: var(--accent-soft); color: var(--fg); padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- Heute */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .today-grid { grid-template-columns: 1fr; } }
.side-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.plan-card { padding: 22px; gap: 16px; }
.plan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.plan-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan-step { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border-left: 5px solid var(--c, var(--line)); }
.plan-step.k-break { border-left-color: var(--line); background: transparent; border: 1px dashed var(--line); border-left-width: 5px; }
.plan-step .step-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--c, var(--accent)); flex: none; }
.plan-step .step-body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.plan-step .step-min { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plan-step.is-done { opacity: .55; }
.plan-step.is-done .step-ico { background: var(--good); color: #fff; }
.plan-step.is-current { outline: 2px solid var(--accent); }
.plan-steps.compact .plan-step { padding: 9px 12px; }
.plan-cta { margin-top: 4px; }
.plan-cta p { flex: 1 1 260px; }

.exam-row { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.card-head + .exam-row { border-top: 0; }
.exam-count { width: 58px; height: 58px; border-radius: 12px; background: var(--surface-2); border-top: 5px solid var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1; }
.exam-count strong { font-size: 1.35rem; }
.exam-count span { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.exam-count.hot { background: var(--bad-soft); }
.exam-count.hot strong { color: var(--bad); }
.exam-count.big { width: 76px; height: 76px; }
.exam-count.big strong { font-size: 1.8rem; }
.exam-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.ready { display: flex; align-items: center; gap: 10px; }
.ready.big { padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
.ready.mini { width: 130px; flex: none; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.wday i { width: 100%; max-width: 40px; height: 34px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: #fff; }
.wday.done i { background: var(--good); }
.wday.missed i { background: var(--bad-soft); }
.wday.free i { background: transparent; border: 1px dashed var(--line); }
.wday.today span { color: var(--accent); }
.wday.today i { box-shadow: 0 0 0 2px var(--accent); }

/* ---------- Lernzeit */
body.focus-mode .page-head { display: none; }
.session { display: flex; flex-direction: column; gap: 14px; --c: var(--accent); }
.session-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 5; }
.session-top { display: flex; align-items: center; gap: 12px; }
.step-pills { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex: 1; overflow-x: auto; justify-content: center; }
.spill { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.spill .ico { width: 16px; height: 16px; }
.spill.done { background: var(--good-soft); color: var(--good); }
.spill.cur { background: var(--accent); color: var(--accent-ink); }
.session-clock { display: flex; flex-direction: column; gap: 8px; }
.session-clock > div:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.clock-label { font-weight: 650; color: var(--muted); min-width: 0; }
.clock { font-size: 2rem; font-weight: 800; letter-spacing: 0.02em; }
.clock-bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.clock-fill { height: 100%; background: var(--c); transition: width 1s linear; }
.time-banner { display: flex; gap: 8px; align-items: center; background: var(--good-soft); color: var(--good); font-weight: 700; padding: 10px 14px; border-radius: 12px; }
.session-body { display: flex; flex-direction: column; }
@media (max-width: 640px) { .spill span { display: none; } .clock { font-size: 1.6rem; } }

.task { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
.task-meta { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 700; color: var(--muted); }
.task .label { display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.76rem; font-weight: 800; color: var(--muted); }
.prompt { font-size: 1.65rem; font-weight: 700; line-height: 1.3; font-family: var(--font-head); overflow-wrap: anywhere; }
.prompt.math { font-size: 1.2rem; font-weight: 600; line-height: 1.55; }
sup { font-size: 0.7em; }
.answer-input { width: 100%; font: 600 1.35rem/1.3 var(--font); padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
.answer-input:focus { border-color: var(--accent); outline: none; }
.answer-input.is-right { border-color: var(--good); background: var(--good-soft); }
.answer-input.is-close { border-color: var(--warn); background: var(--warn-soft); }
.answer-input.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer-input.num { font-size: 1.2rem; max-width: 220px; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) { .options { grid-template-columns: 1fr; } }
.option { min-height: 58px; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); font: 600 1.08rem/1.3 var(--font); text-align: left; cursor: pointer; }
.option:hover { border-color: var(--accent); }
.option.is-right { border-color: var(--good); background: var(--good-soft); }
.option.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.options.locked .option { cursor: default; }
.feedback { display: flex; flex-direction: column; gap: 10px; }
.feedback:empty { display: none; }
.fb { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 10px 14px; border-radius: 10px; flex-wrap: wrap; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.mid { background: var(--warn-soft); color: var(--warn); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 0.95rem; }
.note .ico { color: var(--accent); margin-top: 2px; }
.answer-reveal { padding: 14px 16px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.answer-text { font-size: 1.15rem; font-weight: 600; }
.btn.rate { flex: 1 1 140px; min-height: 52px; }
.btn.rate.bad { border-color: var(--bad); color: var(--bad); }
.btn.rate.mid { border-color: var(--warn); color: var(--warn); }
.btn.rate.good { background: var(--good); border-color: var(--good); color: #fff; }
.math-fields { display: flex; flex-wrap: wrap; gap: 14px 24px; }
.math-field { display: flex; align-items: center; gap: 10px; }
.math-label { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.unit { color: var(--muted); font-weight: 600; }
.fig-wrap { color: var(--muted); max-width: 300px; }
.fig { width: 100%; height: auto; display: block; }
.solution { background: var(--surface-2); border-radius: 12px; padding: 12px 16px; }
.solution ol { margin: 6px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; font-size: 1.02rem; }
.md h3 { font-size: 1.3rem; margin: 4px 0 6px; }
.md h4 { font-size: 1.05rem; margin: 14px 0 4px; color: var(--c, var(--accent)); }
.md p { margin: 4px 0; max-width: 68ch; }
.md ul { margin: 4px 0; padding-left: 22px; max-width: 68ch; }
.md li { margin: 3px 0; }
.reader { max-width: 820px; }

.step-done { padding: 34px 22px; gap: 14px; }
.big-check { width: 64px; height: 64px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; }
.big-check .ico { width: 34px; height: 34px; }
.break-card { padding: 34px 22px; }
.break-tips { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; }
.break-tips li { background: var(--surface-2); padding: 10px 14px; border-radius: 10px; font-weight: 600; }
@media (max-width: 640px) { .break-tips { grid-template-columns: 1fr; } }

  var STUDENT_COLS = { progress: 1, sessions: 1, redemptions: 1 };

  function emptyData() { var d = {}; COLS.forEach(function (c) { d[c] = {}; }); return d; }

  var store = {
    mode: window.LP_DEMO ? 'local' : 'remote',
    data: emptyData(),
    pinSet: false,
    token: null,
    online: true,
    listeners: [],

    onChange: function (fn) { this.listeners.push(fn); },
    emit: function () { var self = this; this.listeners.forEach(function (fn) { fn(self); }); },

    list: function (col) {
      var o = this.data[col] || {};
      return Object.keys(o).map(function (k) { return o[k]; });
    },
    get: function (col, id) { return (this.data[col] || {})[id] || null; },

    load: function () {
      var self = this;
      if (self.mode === 'local') {
        var saved = lsGet('lp_demo_db', null);
        if (!saved) {
          saved = emptyData();
          var seed = LP.buildSeed({ demo: true });
          COLS.forEach(function (c) { (seed[c] || []).forEach(function (doc) { saved[c][doc.id] = doc; }); });
          lsSet('lp_demo_db', saved);
        }
        COLS.forEach(function (c) { if (!saved[c]) saved[c] = {}; });
        self.data = saved;
        self.pinSet = true;
        self.token = ssGet('lp_token');
        return Promise.resolve();
      }
      self.token = ssGet('lp_token');
      return fetch('api/state', { headers: self.headers(), cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (res) {
          var data = res.data || emptyData();
          COLS.forEach(function (c) { if (!data[c]) data[c] = {}; });
          // Noch nicht übertragene Änderungen wieder anwenden, damit nichts „zurückspringt“
          self.outbox().forEach(function (op) {
            if (op.method === 'PUT') data[op.col][op.id] = op.doc; else delete data[op.col][op.id];
          });
          self.data = data;
          self.pinSet = res.pinSet;
          if (self.token && !res.parent) { self.token = null; ssSet('lp_token', null); }
          self.online = true;
          lsSet('lp_cache', data);
        })
        .catch(function (err) {
          var cached = lsGet('lp_cache', null);
          self.online = false;
          if (cached) { self.data = cached; return; }
          throw err;
        });

    headers: function () {
      var hd = { 'Content-Type': 'application/json' };
      if (this.token) hd['X-Parent-Token'] = this.token;
      return hd;
    },

    isParent: function () { return Boolean(this.token); },

    put: function (col, doc) {
      if (!doc.id) doc.id = uid();
      if (!STUDENT_COLS[col] && !this.isParent()) { toast('Nur im Eltern-Bereich änderbar.', 'warn'); return Promise.resolve(false); }
      this.data[col][doc.id] = doc;
      this.persist({ method: 'PUT', col: col, id: doc.id, doc: doc });
      this.emit();
      return Promise.resolve(true);
    },

    del: function (col, id) {
      if (!STUDENT_COLS[col] && !this.isParent()) return Promise.resolve(false);
      delete this.data[col][id];
      this.persist({ method: 'DELETE', col: col, id: id });
      this.emit();
      return Promise.resolve(true);
    },

    persist: function (op) {
      if (this.mode === 'local') { lsSet('lp_demo_db', this.data); return; }
      lsSet('lp_cache', this.data);

    outbox: function () { return lsGet('lp_outbox', []); },

    flushing: false,
    flush: function () {
      var self = this;

      if (!box.length) return Promise.resolve();
      self.flushing = true;

      var url = 'api/c/' + op.col + '/' + encodeURIComponent(op.id);

          if (r.status === 401) {
            toast('Änderung nicht gespeichert: Eltern-Anmeldung abgelaufen.', 'warn');

            throw new Error('HTTP ' + r.status);

          // erledigt (oder endgültig abgelehnt) -> aus der Warteschlange nehmen
          var rest = self.outbox();
          if (rest.length && rest[0].col === op.col && rest[0].id === op.id) rest.shift();

          if (!self.online) { self.online = true; self.emit(); }

    logout: function () {
      var self = this;

    changePin: function (pin) {

      var self = this;
      var data = json && json.data ? json.data : json;
      if (!data || typeof data !== 'object' || !data.decks) return Promise.reject(new Error('Das ist keine Lernportal-Sicherung.'));
      if (self.mode === 'local') {
        COLS.forEach(function (c) { if (!data[c]) data[c] = {}; });
        self.data = data; lsSet('lp_demo_db', data); self.emit();
        return Promise.resolve();
      }
      return self.api('import', { data: data }).then(function () { return self.load(); }).then(function () { self.emit(); });
    },

    resetDemo: function () { lsDel('lp_demo_db'); lsDel('lp_run'); location.reload(); }
  };

  /* ---------------------------------------------------------------- Einstellungen & Fächer */

  var DEFAULT_SETTINGS = { id: 'main', studentName: '', days: [1, 2, 3, 4, 5], startTime: '16:00', minutes: 45, idleSeconds: 90 };
  function settings() { return Object.assign({}, DEFAULT_SETTINGS, store.get('settings', 'main') || {}); }
  function subjects() { return store.list('subjects').sort(function (a, b) { return (a.order || 99) - (b.order || 99) || a.name.localeCompare(b.name); }); }
  function subject(id) { return store.get('subjects', id) || { id: id, name: id || 'Allgemein', color: '#6b7280', short: '?' }; }

  var EXAM_TYPES = {

    karten: { label: 'Karteikarten', hint: 'Frage und Antwort – zum Aufdecken und Selbsteinschätzen' },
    quiz: { label: 'Quiz', hint: 'Frage mit richtiger und falschen Antworten' },
    merkblatt: { label: 'Merkblatt', hint: 'Zusammenfassung zum Lesen' },
    mathe: { label: 'Mathe-Training', hint: 'Automatisch erzeugte Aufgaben mit Lösungsweg' }
  };

  Object.assign(LP, {
    h: h, clear: clear, svg: svg, I: I,
    iso: iso, today: today, parseDay: parseDay, addDays: addDays, daysBetween: daysBetween, weekday: weekday,
    fmtDay: fmtDay, fmtShort: fmtShort, fmtLong: fmtLong, relDay: relDay, fmtClock: fmtClock, WD: WD, WD_LONG: WD_LONG,
    uid: uid, shuffle: shuffle, clamp: clamp, lsGet: lsGet, lsSet: lsSet, lsDel: lsDel, toast: toast, copyText: copyText,
    store: store, settings: settings, subjects: subjects, subject: subject, EXAM_TYPES: EXAM_TYPES, DECK_KINDS: DECK_KINDS
  });
})();

        note: 'Runde auf eine Nachkommastelle.',
        answers: [{ label: 'b', unit: unit, value: rnd(leg, 1), tol: 0.051 }],
        steps: ['b^{2} = c^{2} − a^{2}', 'b^{2} = ' + n(cr) + '^{2} − ' + n(a) + '^{2} = ' + n(rnd(cr * cr, 2)) + ' − ' + n(a * a) + ' = ' + n(rnd(cr * cr - a * a, 2)),
          'b = √' + n(rnd(cr * cr - a * a, 2)) + ' ≈ ' + nz(leg, 1) + ' ' + unit],

(function () {

  function norm(s) {
    return String(s || '').toLowerCase()

      .replace(/[.,!?;:"„“”()…]/g, ' ')

    if (a === b) return 0;
    var m = a.length, n = b.length, prev = [], cur, i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }

      var noParen = norm(alt.replace(/\([^)]*\)/g, ''));

    if (this.mathTopicsOverride && this.mathTopicsOverride.length) return true;
    return this.decks().some(function (d) {
      return d.kind === 'mathe' ? (d.topics || []).length : d.kind === 'merkblatt' ? Boolean(d.text) : (d.cards || []).length;
    });

  Engine.prototype.next = function () {
    var self = this;

    var t = LP.today();

    // 1) Merkblätter zuerst, wenn sie seit 2 Tagen nicht gelesen wurden
    if (!self.opts.test) {

        }
      }
    }

    var cardDecks = decks.filter(function (d) { return ['vokabeln', 'karten', 'quiz'].indexOf(d.kind) >= 0 && (d.cards || []).length; });
    var mathDecks = decks.filter(function (d) { return d.kind === 'mathe' && (d.topics || []).length; });
    if (self.mathTopicsOverride && !mathDecks.length) mathDecks = [{ id: '__math', subjectId: 'mathe', title: 'Mathe-Training', kind: 'mathe', topics: self.mathTopicsOverride }];
    if (self.opts.test) {
      // Im Mini-Test lieber Aufgaben, die automatisch geprüft werden können
      var checkable = cardDecks.filter(function (d) { return d.kind !== 'karten'; });
      if (checkable.length) cardDecks = checkable;
    }

    var useMath = mathDecks.length && (!cardDecks.length || self.count % 2 === 0);
    if (useMath) {
      var topics = self.mathTopicsOverride || [];

      // schwache Themen öfter
      var weighted = [];
      topics.forEach(function (tp) { var w = 1 + Math.round((1 - mathRate(tp)) * 3); for (var k = 0; k < w; k++) weighted.push(tp); });
      var topic = weighted[Math.floor(Math.random() * weighted.length)];
      return { type: 'math', deck: mathDecks[0], task: LP.math.generate(topic) };
    }
    if (!cardDecks.length) return null;

    // 2) Karten bewerten: falsch beantwortete kommen nach 3 Aufgaben zurück, dann fällige, dann niedrige Fächer
    var best = null, bestScore = Infinity;
    cardDecks.forEach(function (deck) {
      var cram = self.opts.cram && self.opts.cram[deck.id];
      deck.cards.forEach(function (c) {
        var key = progKey(deck.id, c.id);
        var p = prog(deck.id, c.id);
        var score = (p.box || 0) * 3;
        if (p.box > 0 && p.due && p.due <= t) score -= 6;
        if (!p.box) score -= 2;
        if (cram && (p.box || 0) < 4) score -= 4;
        if (self.retry[key] && self.retry[key] <= self.count) score -= 20;
        var idx = self.recent.indexOf(key);
        if (idx >= 0) score += 40 - idx * 5;
        score += Math.random() * 2;
        if (score < bestScore) { bestScore = score; best = { deck: deck, card: c, key: key, prog: p }; }
      });
    });
    if (!best) return null;
    self.recent.unshift(best.key);
    self.recent = self.recent.slice(0, Math.min(5, Math.max(1, self.totalCards() - 1)));

    if (deck.kind === 'quiz') { item.type = 'quiz'; item.options = LP.shuffle([best.card.b].concat(best.card.x || [])); return item; }

      item.mode = 'type';

  /* ---------------------------------------------------------------- Lernplan */

  function examPrepDays(exam) {

  function examList(from, to) {
    var out = [];
    store.list('exams').forEach(function (e) {
      if (!e.date) return;
      if (!e.repeat) { out.push(e); return; }
      var skip = e.skipDates || [];
      var d = e.date;
      if (d < from) d = LP.addDays(d, Math.ceil(LP.daysBetween(d, from) / 7) * 7);
      for (var i = 0; i < 60 && d <= to; i++) {
        if ((!e.until || d <= e.until) && skip.indexOf(d) < 0) {
          out.push(Object.assign({}, e, { id: e.id + '__' + d, baseId: e.id, date: d }));
        }
        d = LP.addDays(d, 7);
      }
    });
    return out;
  }
  function nextOccurrence(e) {

    return list.length ? list[0].date : null;
  }
  // Termine am heutigen Tag sind nachmittags (zur Lernzeit) schon vorbei
  function stillAhead(e, day) {

  function upcomingExams() {
    var t = LP.today();
    return examList(t, LP.addDays(t, 120)).filter(function (e) { return !e.done && e.date >= t && stillAhead(e, t); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  // Prüfungen, auf die an einem Tag gelernt werden soll – nach Dringlichkeit sortiert
  function activeExams(day) {

    var ranked = subs.slice().sort(function (a, b) {
      var A = avg[a.id] ? avg[a.id].s / avg[a.id].n : 3.5, B = avg[b.id] ? avg[b.id].s / avg[b.id].n : 3.5;

  function buildPlan(day, minutesOverride) {
    var st = LP.settings();

    var act = activeExams(day);
    var warm = Math.max(3, Math.round(total * 0.12));
    var test = Math.max(3, Math.round(total * 0.12));
    var brk = total >= 35 ? 5 : 0;
    var main = total - warm - test - brk;
    var blocks = brk ? [Math.ceil(main / 2), Math.floor(main / 2)] : [main];

    var focus = [];
    function examBlock(a) {
      var e = a.exam;
      var cram = {};
      if (a.left <= 3) (e.deckIds || []).forEach(function (id) { cram[id] = true; });
      return { kind: 'focus', title: LP.subject(e.subjectId).name + ': ' + (e.title || LP.EXAM_TYPES[e.type].short), subjectId: e.subjectId,
        examId: e.id, deckIds: (e.deckIds || []).slice(), cram: cram, reason: (LP.EXAM_TYPES[e.type] || {}).short + ' ' + LP.relDay(e.date) };
    }
    function basicsBlock(sub) {
      return { kind: 'focus', title: sub.name + ': Grundlagen', subjectId: sub.id, deckIds: practiceDecksFor(sub.id), reason: 'Grundlagen festigen' };
    }
    if (act.length) focus.push(examBlock(act[0]));
    if (blocks.length > 1) {
      if (act.length > 1) focus.push(examBlock(act[1]));
      else if (act.length === 1) {
        var other = weakestSubject(day);
        if (other && other.id === act[0].exam.subjectId) {
          var subs = LP.subjects().filter(function (s) { return s.id !== other.id; });
          other = subs.length ? subs[LP.parseDay(day).getDate() % subs.length] : null;
        }
        focus.push(other ? basicsBlock(other) : examBlock(act[0]));
      }
    }
    while (focus.length < blocks.length) {
      var w = weakestSubject(LP.addDays(day, focus.length));
      if (!w) break;
      if (focus.length && focus[0].subjectId === w.id) {
        var rest = LP.subjects().filter(function (s) { return s.id !== w.id; });
        if (rest.length) w = rest[0];
      }
      focus.push(basicsBlock(w));
    }

    var due = allDueDeckIds();
    var warmDecks = due.length ? due : (focus[0] ? focus[0].deckIds.slice() : []);
    var steps = [];
    steps.push({ kind: 'review', title: 'Aufwärmen', sub: due.length ? 'Fällige Wiederholungen' : 'Schnellrunde', minutes: warm, deckIds: warmDecks });
    focus.forEach(function (f, i) {
      f.minutes = blocks[i];
      f.sub = f.reason;
      steps.push(f);
      if (i === 0 && brk) steps.push({ kind: 'break', title: 'Pause', sub: 'Aufstehen, trinken, durchatmen', minutes: brk });
    });
    var testDecks = [];
    focus.forEach(function (f) { testDecks = testDecks.concat(f.deckIds); });
    steps.push({ kind: 'test', title: 'Mini-Test', sub: '5 Fragen zu heute', minutes: test, deckIds: testDecks, questions: 5 });
    steps.forEach(function (s, i) { s.id = 's' + i; });
    return { day: day, total: total, steps: steps, focusExams: act.map(function (a) { return a.exam.id; }) };
  }

  function isLearningDay(day) {
    return LP.settings().days.indexOf(LP.weekday(day)) >= 0;
  }

  /* ---------------------------------------------------------------- Punkte, Serie, Level */

  function sessions() { return store.list('sessions'); }
  function totalXp() { return sessions().reduce(function (a, s) { return a + (Number(s.xp) || 0); }, 0); }
  function spentXp() {
    return store.list('redemptions').filter(function (r) { return r.status !== 'abgelehnt'; })
      .reduce(function (a, r) { return a + (Number(r.cost) || 0); }, 0);

  function balance() { return totalXp() - spentXp(); }
  var LEVELS = ['Einsteiger', 'Starter', 'Durchstarter', 'Aufsteiger', 'Könner', 'Profi', 'Ass', 'Meister', 'Champion', 'Legende'];

    var n = 0;
    while (100 * (n + 1) * (n + 2) / 2 <= xp) n++;

    return { n: n + 1, name: LEVELS[Math.min(n, LEVELS.length - 1)], cur: cur, next: nxt, pct: (xp - cur) / (nxt - cur) };
  }

  }

  }

  var XP = { right: 2, close: 1, block: 10, session: 20 };

  LP.learn = {
    norm: norm, checkText: checkText, lev: lev,
    prog: prog, grade: grade, deckMastery: deckMastery, examReadiness: examReadiness, dueCount: dueCount,
    mathRate: mathRate, markRead: markRead, lastRead: lastRead,
    Engine: Engine,
    examPrepDays: examPrepDays, examList: examList, nextOccurrence: nextOccurrence, upcomingExams: upcomingExams, activeExams: activeExams, buildPlan: buildPlan, isLearningDay: isLearningDay,
    totalXp: totalXp, balance: balance, level: level, streak: streak, doneToday: doneToday, doneDays: doneDays, minutesOn: minutesOn,
    XP: XP
  };
})();

            input.classList.add('is-right'); input.readOnly = true;

            stage = 'done'; LP.clear(row); finish('right', 900);
          } else if (r === 'close') {

            fbv.appendChild(h('div', { class: 'fb mid' }, 'Fast! Achte auf die Schreibweise: ', h('strong', null, item.answer)));

      card.appendChild(h('div', { class: 'prompt math' }, mathText(task.q)));
      if (task.fig && FIGS[task.fig]) card.appendChild(h('div', { class: 'fig-wrap', html: FIGS[task.fig] }));
      if (task.note) card.appendChild(h('div', { class: 'muted small' }, task.note));

      var fields = h('div', { class: 'math-fields' });

        inputs.push(inp);

        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); if (inputs[i + 1] && !inputs[i + 1].value) inputs[i + 1].focus(); else checkMath(); }
        });
      });
      card.appendChild(fields);
      var fbm = h('div', { class: 'feedback' });
      var rowm = h('div', { class: 'row end' });

        return h('div', { class: 'solution' }, h('div', { class: 'label' }, 'Lösungsweg'),
          h('ol', null, task.steps.map(function (s) { return h('li', null, mathText(s)); })));

      function checkMath() {
        if (finished) return;
        if (inputs.some(function (i) { return !i.value.trim(); })) { var empty = inputs.filter(function (i) { return !i.value.trim(); })[0]; empty.focus(); return; }
        var res = LP.math.check(task, inputs.map(function (i) { return i.value; }));
        tries++;
        inputs.forEach(function (inp, i) { inp.classList.remove('is-wrong'); if (!res.each[i]) inp.classList.add('is-wrong'); else inp.classList.add('is-right'); });
        Array.prototype.slice.call(fbm.querySelectorAll('.fb')).forEach(function (n) { n.parentNode.removeChild(n); });

          LP.clear(rowm);

          else finish(result, 1000);
        } else if (tries === 1 && !opts.test) {
          fbm.appendChild(h('div', { class: 'fb mid' }, 'Noch nicht ganz. Prüfe deine Rechnung – du hast noch einen Versuch.'));
          var wrongOne = inputs.filter(function (inp, i) { return !res.each[i]; })[0];

        } else {
          inputs.forEach(function (i) { i.readOnly = true; });
          fbm.appendChild(h('div', { class: 'fb bad' }, svg(I.x), 'Richtig wäre: ' + task.answers.map(function (a) {

          }).join(';  ')));
          fbm.appendChild(solution());
          LP.clear(rowm); rowm.appendChild(nextButton('wrong'));
        }
      }
      if (!opts.test) rowm.appendChild(hintBtn);
      rowm.appendChild(h('button', { class: 'btn primary big', onclick: checkMath }, 'Prüfen'));
      card.appendChild(fbm);
      card.appendChild(rowm);
      setTimeout(function () { if (inputs[0]) inputs[0].focus(); }, 60);
    }
  }

  // kurzer Ton (nur nach einer Berührung möglich)
  var audioCtx = null;
  function beep(kind) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      var notes = kind === 'done' ? [660, 880, 1046] : [880];
      notes.forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.14);
        g.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.14 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.14 + 0.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + i * 0.14); o.stop(audioCtx.currentTime + i * 0.14 + 0.32);
      });
    } catch (e) { /* kein Ton möglich */ }
  }

  LP.ui = { mathText: mathText, markdown: markdown, progressBar: progressBar, subjectChip: subjectChip, dialog: dialog, renderItem: renderItem, beep: beep, FIGS: FIGS };
})();

  // Säulendiagramm: Lernminuten der letzten 14 Tage (eine Reihe, Ziel-Linie = geplante Minuten)
  function minutesChart() {
    var t = LP.today(), st = LP.settings();
    var days = [];
    for (var i = 13; i >= 0; i--) days.push(LP.addDays(t, -i));
    var vals = days.map(function (d) { return L.minutesOn(d); });
    var target = Number(st.minutes) || 45;
    var max = Math.max(target * 1.25, Math.max.apply(null, vals) * 1.1, 10);
    var W = LP.clamp((window.innerWidth || 800) - (window.innerWidth > 860 ? 300 : 70), 340, 900), H = 200, pl = 34, pr = 8, pt = 12, pb = 28;
    var cw = (W - pl - pr) / days.length, bw = Math.min(22, cw * 0.56);
    var y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var parts = [];
    var ticks = [0, Math.round(max / 2 / 5) * 5, Math.round(max / 5) * 5].filter(function (v, i, a) { return a.indexOf(v) === i && v <= max; });
    ticks.forEach(function (v) {
      parts.push('<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/>');
      parts.push('<text x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="axis">' + v + '</text>');
    });
    parts.push('<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(target) + '" y2="' + y(target) + '" class="target"/>');
    parts.push('<text x="' + (W - pr) + '" y="' + (y(target) - 5) + '" text-anchor="end" class="axis">Ziel ' + target + ' min</text>');
    days.forEach(function (d, i) {
      var x = pl + cw * i + (cw - bw) / 2, v = vals[i];
      var bh = Math.max(0, y(0) - y(v));
      var lbl = LP.fmtDay(d) + ': ' + v + ' min';
      if (v > 0) {
        var r = Math.min(4, bh);

      hist.forEach(function (r) { hc.appendChild(h('div', { class: 'list-row' }, h('span', { class: 'grow' }, r.title), h('span', { class: 'muted small' }, LP.fmtDay(r.date)), h('span', { class: 'pill ' + (r.status === 'eingelöst' ? 'good' : 'bad') }, r.status))); });
      el.appendChild(hc);
    }
  }

  /* ---------------------------------------------------------------- Einstellungen */

  function settingsView(el) {
    var st = LP.settings();
    var days = st.days.slice();
    var dayBox = h('div', { class: 'day-pick' });
    [1, 2, 3, 4, 5, 6, 0].forEach(function (d) {
      dayBox.appendChild(h('label', { class: 'day-toggle' }, h('input', { type: 'checkbox', checked: days.indexOf(d) >= 0, onchange: function () {
        if (this.checked) days.push(d); else days = days.filter(function (x) { return x !== d; });
      } }), h('span', null, LP.WD[d])));
    });
    var form = h('form', { class: 'card form', onsubmit: function (e) {
      e.preventDefault();
      store.put('settings', Object.assign({}, store.get('settings', 'main') || {}, {
        id: 'main', studentName: val('st-name').trim(), days: days, startTime: val('st-time') || '16:00',
        minutes: LP.clamp(Number(val('st-min')) || 45, 15, 120), idleSeconds: LP.clamp(Number(val('st-idle')) || 90, 30, 600)
      }));
      LP.toast('Einstellungen gespeichert', 'good');
    } },
    h('h2', null, 'Feste Lernzeit'),
    h('p', { class: 'muted small' }, 'Feste Tage, feste Uhrzeit, fester Ablauf: Aufwärmen → Block 1 → Pause → Block 2 → Mini-Test. Die Inhalte richten sich automatisch nach den nächsten Terminen.'),
    h('div', { class: 'form-grid' },
      field('Name des Kindes', h('input', { id: 'st-name', type: 'text', value: st.studentName })),
      field('Beginn', h('input', { id: 'st-time', type: 'time', value: st.startTime })),
      field('Dauer (Minuten)', h('input', { id: 'st-min', type: 'number', min: 15, max: 120, step: 5, value: st.minutes }), '30–45 Minuten sind für Klasse 9 ein guter Wert.'),
      field('Pause bei Untätigkeit nach (Sek.)', h('input', { id: 'st-idle', type: 'number', min: 30, max: 600, value: st.idleSeconds }), 'Die Uhr stoppt, wenn nichts getan wird.')),
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Lerntage'), dayBox),
    h('div', { class: 'row end' }, h('button', { class: 'btn primary', type: 'submit' }, 'Speichern')));
    el.appendChild(form);

    // Vorschau des heutigen Plans
    var plan = L.buildPlan(LP.today());
    el.appendChild(h('section', { class: 'card' }, h('h2', null, 'So sieht der Plan heute aus'),
      h('ol', { class: 'plan-steps compact' }, plan.steps.map(function (s) {
        return h('li', { class: 'plan-step k-' + s.kind, style: s.subjectId ? { '--c': LP.subject(s.subjectId).color } : null },
          h('span', { class: 'step-body' }, h('strong', null, s.title), h('span', { class: 'muted small' }, s.sub || '')), h('span', { class: 'step-min' }, s.minutes + ' min'));
      }))));

    // PIN
    var pinIn = h('input', { id: 'st-pin', type: 'password', inputmode: 'numeric', maxlength: 12, placeholder: 'Neue PIN (4–12 Ziffern)' });
    el.appendChild(h('form', { class: 'card form', onsubmit: function (e) {
      e.preventDefault();
      if (!/^\d{4,12}$/.test(pinIn.value)) { LP.toast('Bitte 4 bis 12 Ziffern.', 'warn'); return; }
      store.changePin(pinIn.value).then(function () { pinIn.value = ''; LP.toast('PIN geändert', 'good'); }, function (ex) { LP.toast(ex.message, 'warn'); });
    } }, h('h2', null, 'Eltern-PIN ändern'), h('div', { class: 'row' }, pinIn, h('button', { class: 'btn primary', type: 'submit' }, 'Ändern'))));

    // Sicherung
    var out = h('textarea', { id: 'st-backup', rows: 4, class: 'mono', readonly: true, hidden: true });
    var inp = h('input', { type: 'file', accept: '.json,application/json', id: 'st-file' });
    el.appendChild(h('section', { class: 'card form' }, h('h2', null, 'Datensicherung'),
      h('p', { class: 'muted small' }, store.mode === 'remote' ? 'Der Server legt täglich automatisch eine Sicherung im Ordner data/backups an. Zusätzlich können Sie hier alles herunterladen oder wiederherstellen.' : 'Demo-Version: Daten liegen nur in diesem Browser.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn ghost', type: 'button', onclick: function () {
          store.exportAll().then(function (json) {
            var text = JSON.stringify(json, null, 1);
            try {
              var blob = new Blob([text], { type: 'application/json' });
              var a = h('a', { href: URL.createObjectURL(blob), download: 'lernportal-sicherung-' + LP.today() + '.json' });
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
            } catch (e2) { /* Download blockiert */ }
            out.value = text; out.hidden = false;
          });
        } }, svg(I.download), 'Sicherung herunterladen'),
        h('label', { class: 'btn ghost file-btn' }, svg(I.upload), 'Sicherung einspielen', inp)),
      out));
    inp.addEventListener('change', function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var json;
        try { json = JSON.parse(r.result); } catch (e) { LP.toast('Datei ist kein gültiges JSON.', 'warn'); return; }
        ui.dialog({ title: 'Sicherung einspielen?', text: 'Alle aktuellen Daten werden durch die Sicherung ersetzt.', ok: 'Einspielen', danger: true }).then(function (y) {
          if (!y) return;
          store.importAll(json).then(function () { LP.toast('Sicherung eingespielt', 'good'); LP.rerender(); }, function (ex) { LP.toast(ex.message, 'warn'); });
        });
      };
      r.readAsText(f);
    });

    if (store.mode === 'local') {
      el.appendChild(h('section', { class: 'card' }, h('h2', null, 'Demo zurücksetzen'), h('p', { class: 'muted small' }, 'Stellt die Beispieldaten wieder her.'),
        h('button', { class: 'btn danger ghost', onclick: function () { store.resetDemo(); } }, 'Zurücksetzen')));
    }
  }
})();

/* js/main.js */
/*
 * Start, Navigation (Hash-Routing) und regelmäßiges Nachladen neuer Daten.
 */
(function () {
  'use strict';
  var LP = window.LP, h = LP.h, svg = LP.svg, I = LP.I, store = LP.store, V = LP.views;

  var app = document.getElementById('app');
  var cleanup = null;

  var NAV = [
    ['heute', 'Heute', I.today], ['termine', 'Termine', I.calendar], ['training', 'Training', I.dumbbell], ['fortschritt', 'Fortschritt', I.trophy]
  ];

  // In der Demo (eingebettet) wird intern navigiert, sonst über den Hash in der Adresszeile
  var current = '#/heute';
  LP.go = function (target) {
    if (store.mode === 'local') { current = target; render(); window.scrollTo(0, 0); }
    else if (location.hash === target) render();
    else location.hash = target;
  };
  if (store.mode === 'local') {
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented) return;
      var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
      if (!a) return;
      e.preventDefault();
      LP.go(a.getAttribute('href'));
    });
  }

  function route() {
    var raw = ((store.mode === 'local' ? current : location.hash) || '#/heute').replace(/^#\/?/, '');
    var parts = raw.split('/');
    return { name: parts[0] || 'heute', sub: parts[1] || '', arg: parts.slice(2).join('/') || '' };
  }

  function render() {
    if (cleanup) { try { cleanup(); } catch (e) { /* egal */ } cleanup = null; }
    var r = route();
    LP.clear(app);
    var focusMode = r.name === 'lernzeit';
    document.body.classList.toggle('focus-mode', focusMode);

    if (!focusMode) {
      var nav = h('nav', { class: 'nav', 'aria-label': 'Hauptnavigation' },
        h('div', { class: 'brand' }, h('span', { class: 'brand-mark' }, 'L'), h('span', { class: 'brand-name' }, 'Lernportal')),
        h('div', { class: 'nav-links' }, NAV.map(function (n) {
          return h('a', { href: '#/' + n[0], class: 'nav-link' + (r.name === n[0] ? ' active' : '') }, svg(n[2]), h('span', null, n[1]));
        })),
        h('a', { href: '#/eltern', class: 'nav-link parent-link' + (r.name === 'eltern' ? ' active' : ''), title: 'Eltern-Bereich' }, svg(store.isParent() ? I.unlock : I.gear), h('span', null, 'Eltern')));
      app.appendChild(nav);
    }
    var main = h('main', { class: 'view', id: 'view' });
    app.appendChild(main);
    if (!store.online && store.mode === 'remote') {
      main.appendChild(h('div', { class: 'offline' }, 'Keine Verbindung zum Lernportal-Server. Du kannst weiterlernen – alles wird übertragen, sobald die Verbindung wieder da ist.'));
    }
    if (LP.LP_DEMO_BANNER) main.appendChild(LP.LP_DEMO_BANNER());

    var res;
    try {
      switch (r.name) {
        case 'heute': res = V.today(main); break;
        case 'lernzeit': res = V.session(main); break;
        case 'termine': res = V.exams(main); break;
        case 'training': res = V.training(main); break;
        case 'lesen': res = V.reader(main, r.sub); break;
        case 'fortschritt': res = V.progress(main); break;
        case 'eltern': res = V.parentGate(main, r.sub, r.arg); break;
        default: LP.go('#/heute'); return;
      }
    } catch (err) {
      console.error(err);
      main.appendChild(h('div', { class: 'card' }, h('h2', null, 'Da ist etwas schiefgelaufen'), h('p', { class: 'muted' }, String(err && err.message || err)), h('a', { class: 'btn primary', href: '#/heute' }, 'Zur Startseite')));
    }
    if (typeof res === 'function') cleanup = res;
    if (!focusMode) window.scrollTo(0, 0);
  }
  LP.rerender = render;

  window.addEventListener('hashchange', render);

  // Neue Daten (z. B. ein neuer Termin von den Eltern) regelmäßig holen – nicht während einer Lernzeit oder beim Bearbeiten
  function refresh() {
    var r = route();
    if (store.mode !== 'remote' || r.name === 'lernzeit' || (r.name === 'eltern' && r.arg)) return;
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    store.flush().then(function () {
      if (store.outbox().length) return;
      return store.load().then(render);
    });
  }
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  window.addEventListener('online', function () { store.flush(); });
  setInterval(function () { store.flush(); }, 15000);

  store.load().then(render, function () {
    LP.clear(app);
    app.appendChild(h('div', { class: 'gate' }, h('div', { class: 'card center' },
      h('h1', null, 'Server nicht erreichbar'),
      h('p', { class: 'muted' }, 'Das Lernportal konnte nicht geladen werden. Läuft der Rechner mit dem Lernportal, und ist das Tablet im WLAN?'),
      h('button', { class: 'btn primary', onclick: function () { location.reload(); } }, 'Erneut versuchen'))));
  });
})();

</script>
